<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল-কুরআনুল কারীম</title>
    <style>
        body {
            background-color: #031A14;
            color: #F0F5F2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #52B788;
            margin: 0;
            font-size: 24px;
        }
        .header p {
            color: #D4AF37;
            font-size: 14px;
            margin-top: 5px;
        }
        .surah-card {
            background: #0E382D;
            border: 1px solid rgba(82, 183, 136, 0.2);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            padding: 16px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .arabic {
            font-size: 24px;
            text-align: right;
            color: #F0F5F2;
            line-height: 1.8;
            margin-bottom: 8px;
            font-family: 'Amiri', 'Scheherazade', serif;
        }
        .bangla {
            font-size: 14px;
            color: #A5C4B9;
            line-height: 1.5;
        }
        .audio-bar {
            margin-top: 10px;
            width: 100%;
        }
        audio {
            width: 100%;
            height: 36px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>আল-কুরআনুল কারীম</h1>
        <p>অনলাইন ও অডিও তিলাওয়াত পোর্টাল</p>
    </div>

    <div class="surah-card">
        <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="bangla">শুরু করছি আল্লাহর নামে যিনি পরম করুণাময়, অতি দয়ালু।</div>
    </div>

    <div class="surah-card">
        <div class="arabic">الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</div>
        <div class="bangla">সমস্ত প্রশংসা আল্লাহ তাআলার যিনি সমগ্র সৃষ্টিজগতের পালনকর্তা।</div>
        <div class="audio-bar">
            <audio controls src="https://everyayah.com/data/Alafasy_128kbps/001002.mp3"></audio>
        </div>
    </div>

    <div class="surah-card">
        <div class="arabic">الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="bangla">যিনি পরম করুণাময় ও অসীম দয়ালু।</div>
        <div class="audio-bar">
            <audio controls src="https://everyayah.com/data/Alafasy_128kbps/001003.mp3"></audio>
        </div>
    </div>
</body>
</html>
